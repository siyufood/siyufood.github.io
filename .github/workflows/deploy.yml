name: Build Pages and Publish Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base:
        description: '后端公网地址，例如 https://xxxx.r35.cpolar.top/jshERP-boot（留空则沿用仓库内 config.js）'
        required: false
        default: ''
      skip_images:
        description: '只重建 Pages，跳过 GHCR 镜像'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  frontend:
    name: Build Vue frontend
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: jshERP-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize and verify backend API base
        id: apibase
        if: ${{ inputs.api_base != '' }}
        env:
          RAW_BASE: ${{ inputs.api_base }}
        run: |
          set -euo pipefail
          base="${RAW_BASE%/}"
          case "$base" in
            */jshERP-boot) ;;
            *) base="$base/jshERP-boot" ;;
          esac
          echo "API base: $base"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$base/platformConfig/getPlatform/name" || true)
          echo "backend probe http status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::后端 $base 不可达（HTTP $code），已阻止发布，避免前端指向死链。"
            exit 1
          fi
          echo "api_base=$base" >> "$GITHUB_OUTPUT"

      - name: Write runtime config.js from API base
        if: ${{ steps.apibase.outputs.api_base != '' }}
        env:
          API_BASE: ${{ steps.apibase.outputs.api_base }}
        run: |
          set -euo pipefail
          cat > public/config.js <<EOF
          /*
           * 思雨食品 ERP 运行时配置
           * 由 GitHub Actions workflow_dispatch 注入：${API_BASE}
           */
          window.ERP_CONFIG = {
            apiBase: '${API_BASE}'
          };
          EOF
          cat public/config.js

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jshERP-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Stamp config.js cache-buster
        run: |
          set -euo pipefail
          ver=$(sha256sum dist/config.js | cut -c1-8)
          echo "config.js version: $ver"
          sed -i -E "s/config\.js\?v=[^\"']*/config.js?v=$ver/" dist/index.html
          grep -o "config.js?v=[0-9a-f]*" dist/index.html

      - name: Verify Pages artifacts
        env:
          API_BASE: ${{ steps.apibase.outputs.api_base }}
        run: |
          test -f dist/index.html
          test -f dist/config.js
          test -f dist/404.html
          test -f dist/.nojekyll
          grep -q "white-space:nowrap" dist/css/*.css
          ! grep -q "__CFG_VER__" dist/index.html
          grep -q "config.js?v=" dist/index.html
          if [ -n "${API_BASE}" ]; then grep -q "${API_BASE}" dist/config.js; fi

      - name: Upload frontend dist for image build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: jshERP-web/dist
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jshERP-web/dist

  deploy:
    name: Deploy GitHub Pages
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  frontend-image:
    name: Build frontend image to GHCR
    needs: frontend
    if: ${{ github.event_name == 'push' || inputs.skip_images == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: jshERP-web/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/siyufood/siyu-erp-frontend:latest
            ghcr.io/siyufood/siyu-erp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-image:
    name: Build backend image to GHCR
    if: ${{ github.event_name == 'push' || inputs.skip_images == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/siyufood/siyu-erp-backend:latest
            ghcr.io/siyufood/siyu-erp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
