name: Mirror DB Images to GHCR

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-db.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: siyufood

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: mariadb:10.11
            target: mariadb
            tag: 10.11
          - source: redis:7-alpine
            target: redis
            tag: 7-alpine
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull / retag / push
        run: |
          set -euo pipefail
          SRC="${{ matrix.source }}"
          DST="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.target }}:${{ matrix.tag }}"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "pushed $DST"
